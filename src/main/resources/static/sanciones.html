<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión de Sanciones</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- SweetAlert2 -->
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="sanciones.css">
</head>
<body>
<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-danger mb-4">
    <div class="container">
        <a class="navbar-brand" href="#">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            Sistema de Gestión de Sanciones
        </a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="index.html">
                <i class="bi bi-building me-1"></i>
                Cubículos
            </a>
        </div>
    </div>
</nav>

<div class="container">
    <!-- Header con título y botón -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>
            <i class="bi bi-exclamation-triangle me-2"></i>
            Gestión de Sanciones
        </h2>
        <button class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#sancionModal" onclick="limpiarFormulario()">
            <i class="bi bi-plus-circle me-2"></i>
            Nueva Sanción
        </button>
    </div>

    <!-- Tabla de sanciones -->
    <div class="card shadow">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover" id="tablaSanciones">
                    <thead class="table-danger">
                    <tr>
                        <th>ID</th>
                        <th>Usuario</th>
                        <th>Motivo</th>
                        <th>Fecha Inicio</th>
                        <th>Fecha Fin</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>
                    <tbody id="sancionesTableBody">
                    <!-- Los datos se cargarán dinámicamente -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Modal para crear/editar sanción -->
<div class="modal fade" id="sancionModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-danger text-white">
                <h5 class="modal-title" id="modalTitle">
                    <i class="bi bi-plus-circle me-2"></i>
                    Nueva Sanción
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="sancionForm">
                    <input type="hidden" id="sancionId">

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="idUsuario" class="form-label">
                                <i class="bi bi-person me-2"></i>
                                Usuario
                            </label>
                            <select class="form-select" id="idUsuario" required>
                                <option value="">Seleccione un usuario</option>
                                <!-- Los usuarios se cargarán dinámicamente -->
                            </select>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="estado" class="form-label">
                                <i class="bi bi-toggle-on me-2"></i>
                                Estado
                            </label>
                            <select class="form-select" id="estado" required>
                                <option value="">Seleccione un estado</option>
                                <option value="activa">Activa</option>
                                <option value="cumplida">Cumplida</option>
                                <option value="cancelada">Cancelada</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="motivo" class="form-label">
                            <i class="bi bi-chat-text me-2"></i>
                            Motivo de la Sanción
                        </label>
                        <textarea class="form-control" id="motivo" rows="3" required
                                  placeholder="Describa el motivo de la sanción"></textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="fechaInicio" class="form-label">
                                <i class="bi bi-calendar-plus me-2"></i>
                                Fecha de Inicio
                            </label>
                            <input type="date" class="form-control" id="fechaInicio" required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="fechaFin" class="form-label">
                                <i class="bi bi-calendar-minus me-2"></i>
                                Fecha de Fin
                            </label>
                            <input type="date" class="form-control" id="fechaFin" required>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                    <i class="bi bi-x-circle me-2"></i>
                    Cancelar
                </button>
                <button type="button" class="btn btn-danger" onclick="guardarSancion()">
                    <i class="bi bi-save me-2"></i>
                    Guardar
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Modal de confirmación para eliminar -->
<div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-danger text-white">
                <h5 class="modal-title">
                    <i class="bi bi-exclamation-triangle me-2"></i>
                    Confirmar Eliminación
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p>¿Está seguro que desea eliminar esta sanción?</p>
                <p class="text-danger"><small>Esta acción no se puede deshacer.</small></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                    <i class="bi bi-x-circle me-2"></i>
                    Cancelar
                </button>
                <button type="button" class="btn btn-danger" onclick="confirmarEliminar()">
                    <i class="bi bi-trash me-2"></i>
                    Eliminar
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="sanciones.js"></script>
</body>
</html>
